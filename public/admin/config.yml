# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: write-tim/snippethub-docs
  branch: main
  base_url: https://sveltia-gatekeeper.onrender.com

# Where uploaded images/media will be stored in the repo and accessed on the site
media_folder: public/images
public_folder: /images

# Editorial workflow (draft, review, publish) - optional
publish_mode: simple

# Search & display settings
site_url: https://snippethub-docs.awesomediscoveryzone.com/
display_url: https://snippethub-docs.awesomediscoveryzone.com/
logo_url: /images/snippethub.svg

collections:
  - name: docs
    label: Support & Documentation
    label_singular: Article
    folder: src/content/docs
    create: true
    nested:
      depth: 3
      summary: "{{title}}"
    slug: "{{slug}}"
    extension: mdx
    format: frontmatter
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        required: true
      - label: "Description"
        name: "description"
        widget: "string"
        required: false
      - label: "Sidebar Navigation Settings"
        name: "sidebar"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - label: "Order (Priority in list)"
            name: "order"
            widget: "number"
            required: false
          - label: "Sidebar Badge"
            name: "badge"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "Badge Text", name: "text", widget: "string", required: false }
              - label: "Badge Color"
                name: "variant"
                widget: "select"
                required: false
                default: "default"
                options:
                  - { label: "Default", value: "default" }
                  - { label: "Tip (Purple)", value: "tip" }
                  - { label: "Success (Green)", value: "success" }
                  - { label: "Note (Blue)", value: "note" }
                  - { label: "Caution (Orange)", value: "caution" }
                  - { label: "Danger (Red)", value: "danger" }
          - label: "Hide from Sidebar"
            name: "hidden"
            widget: "boolean"
            default: false
            required: false
      - label: "Content"
        name: "body"
        widget: "markdown"
        required: true
        editor_components:
          - image
          - code-block
          - aside
          - steps
          - filetree
          - badge
          - tabs
          - linkcard
